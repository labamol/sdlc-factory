name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
      - name: Demo traversal
        run: |
          mkdir -p "$RUNNER_TEMP/demo"
          cp -r policies "$RUNNER_TEMP/demo/policies"
          python -m factory.cli demo --base-dir "$RUNNER_TEMP/demo"
      - name: Intake pipeline demo
        run: |
          mkdir -p "$RUNNER_TEMP/intake"
          python -m factory.cli intake --brd examples/brd/sample-brd.md \
            --meeting examples/meetings/kickoff-transcript.md \
            --base-dir "$RUNNER_TEMP/intake"
      - name: Delivery pipeline demo
        run: |
          mkdir -p "$RUNNER_TEMP/deliver"
          python -m factory.cli deliver --brd examples/brd/sample-brd.md \
            --meeting examples/meetings/kickoff-transcript.md \
            --base-dir "$RUNNER_TEMP/deliver"
      - name: Ship pipeline demo
        run: |
          mkdir -p "$RUNNER_TEMP/ship"
          python -m factory.cli ship --brd examples/brd/sample-brd.md \
            --meeting examples/meetings/kickoff-transcript.md \
            --base-dir "$RUNNER_TEMP/ship"
      - name: Release pipeline demo
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          python -m factory.cli release --brd examples/brd/sample-brd.md \
            --meeting examples/meetings/kickoff-transcript.md \
            --base-dir "$RUNNER_TEMP/release"
